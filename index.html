<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Relay Control Center</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background: #1e293b;
      border-radius: 24px;
      padding: 28px;
      border: 1px solid #334155;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 20px;
      text-align: center;
      margin-bottom: 20px;
      color: #f1f5f9;
      letter-spacing: 0.5px;
    }
    .system-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 12px 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #334155;
      font-weight: 600;
      font-size: 14px;
    }
    .card {
      background: #0f172a;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .title { font-size: 16px; font-weight: 600; }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .badge-on { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .badge-off { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn {
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      color: white;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn-on { background: #16a34a; }
    .btn-off { background: #dc2626; }
    
    .sched-box {
      border-top: 1px dashed #334155;
      padding-top: 14px;
    }
    .sched-title { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
    .time-inputs {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }
    input[type="time"] {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 8px;
      border-radius: 8px;
      width: 100%;
      outline: none;
      font-size: 14px;
    }
    .btn-save {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-save:hover { background: #2563eb; }
  </style>

  <!-- Firebase JavaScript SDK (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="container">
    <h1>SMART RELAY DASHBOARD</h1>

    <!-- SYSTEM POWER STATUS CARD -->
    <div class="system-card">
      <span>Power Status:</span>
      <span id="system-badge" class="badge badge-off">CHECKING...</span>
    </div>

    <!-- NAME BOARD -->
    <div class="card">
      <div class="header">
        <span class="title">Name Board</span>
        <span id="b1-badge" class="badge badge-off">OFF</span>
      </div>
      <div class="btn-grid">
        <button class="btn btn-on" onclick="setBoard('NameBoard', true)">TURN ON</button>
        <button class="btn btn-off" onclick="setBoard('NameBoard', false)">TURN OFF</button>
      </div>
      <div class="sched-box">
        <div class="sched-title">Daily Schedule Window</div>
        <div class="time-inputs">
          <input type="time" id="b1-on-time" value="10:00">
          <span>to</span>
          <input type="time" id="b1-off-time" value="17:00">
        </div>
        <button class="btn-save" onclick="saveSchedule('B1', 'b1-on-time', 'b1-off-time')">Save Schedule</button>
      </div>
    </div>

    <!-- SCROLLING BOARD -->
    <div class="card">
      <div class="header">
        <span class="title">Scrolling Board</span>
        <span id="b2-badge" class="badge badge-off">OFF</span>
      </div>
      <div class="btn-grid">
        <button class="btn btn-on" onclick="setBoard('ScrollingBoard', true)">TURN ON</button>
        <button class="btn btn-off" onclick="setBoard('ScrollingBoard', false)">TURN OFF</button>
      </div>
      <div class="sched-box">
        <div class="sched-title">Daily Schedule Window</div>
        <div class="time-inputs">
          <input type="time" id="b2-on-time" value="10:00">
          <span>to</span>
          <input type="time" id="b2-off-time" value="17:00">
        </div>
        <button class="btn-save" onclick="saveSchedule('B2', 'b2-on-time', 'b2-off-time')">Save Schedule</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAMRB_qmz0o9a7INW-VyiadyTQotYjJbuI",
      authDomain: "project-e8816510-c8d8-4d95-957.firebaseapp.com",
      databaseURL: "https://project-e8816510-c8d8-4d95-957-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "project-e8816510-c8d8-4d95-957",
      storageBucket: "project-e8816510-c8d8-4d95-957.firebasestorage.app",
      messagingSenderId: "469909219568",
      appId: "1:469909219568:web:16cd471e0cf4b47370ba35"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let lastHeartbeatTime = 0;

    // 1. MONITOR ESP-01S HEARTBEAT FOR POWER STATUS
    db.ref('System/Heartbeat').on('value', (snapshot) => {
      lastHeartbeatTime = Date.now();
      updateSystemBadge(true);
    });

    // Timeout check every 2 seconds
    setInterval(() => {
      if (Date.now() - lastHeartbeatTime > 4000) {
        updateSystemBadge(false);
      }
    }, 2000);

    function updateSystemBadge(isOnline) {
      const badge = document.getElementById('system-badge');
      if (isOnline) {
        badge.textContent = "ESP POWERED ON";
        badge.className = "badge badge-on";
      } else {
        badge.textContent = "SYSTEM OFFLINE";
        badge.className = "badge badge-off";
      }
    }

    // 2. REAL-TIME BOARD STATE LISTENERS
    db.ref('NameBoard').on('value', (s) => updateBoardBadge('b1-badge', s.val() || false));
    db.ref('ScrollingBoard').on('value', (s) => updateBoardBadge('b2-badge', s.val() || false));

    function updateBoardBadge(id, state) {
      const badge = document.getElementById(id);
      badge.textContent = state ? 'ONLINE' : 'OFF';
      badge.className = `badge ${state ? 'badge-on' : 'badge-off'}`;
    }

    // 3. MANUAL SWITCHING
    function setBoard(nodeName, state) {
      db.ref(nodeName).set(state);
    }

    // 4. SAVE SCHEDULE TO FIREBASE BUCKET
    function saveSchedule(prefix, onInputId, offInputId) {
      const onVal = document.getElementById(onInputId).value;
      const offVal = document.getElementById(offInputId).value;

      if (!onVal || !offVal) return alert("Please select valid times!");

      const [onH, onM] = onVal.split(':').map(Number);
      const [offH, offM] = offVal.split(':').map(Number);

      const onMinutes = (onH * 60) + onM;
      const offMinutes = (offH * 60) + offM;

      db.ref(`Schedule/${prefix}_ON`).set(onMinutes);
      db.ref(`Schedule/${prefix}_OFF`).set(offMinutes);

      alert("Schedule saved to Firebase!");
    }
  </script>
</body>
</html>
